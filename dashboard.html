<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="navbar">
    <h3>Carpool System</h3>
    <a href="login.html" style="color:white;">Logout</a>
</div>

<div class="dashboard">
    <h2>Welcome User 👋</h2>

    <div class="cards">

        <div class="card-box">
            <h3>Offer Ride</h3>
            <p>Share your ride</p>
            <button>Add Ride</button>
        </div>

        <div class="card-box">
            <h3>Find Ride</h3>
            <p>Search rides</p>
            <button>Search</button>
        </div>

        <div class="card-box">
            <h3>My Bookings</h3>
            <p>View bookings</p>
            <button>View</button>
        </div>

    </div>
</div>

</body>
</html>
